worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # ── Upstream pool — all backend replicas ──────────────────────────────────
    upstream fashion_api {
        least_conn;                      # route to the replica with fewest active connections
        server backend:8000;             # Docker Compose resolves this to every replica
    }

    server {
        listen 80;
        server_name localhost;

        # Generous for CSV uploads of labelled samples.
        client_max_body_size 50M;

        # ── Dashboard ─────────────────────────────────────────────────────────
        # Client-side routing: /classify and /evaluation have no file behind
        # them, so anything that isn't a real asset falls through to index.html
        # or a refresh on a deep link would 404.
        location / {
            root       /usr/share/nginx/html;
            try_files  $uri $uri/ /index.html;
        }

        # Hashed build assets are immutable — a new build produces new
        # filenames, so they can be cached hard.
        location /assets/ {
            root       /usr/share/nginx/html;
            expires    1y;
            add_header Cache-Control "public, immutable";
        }

        # ── API ───────────────────────────────────────────────────────────────
        # Matched explicitly rather than by prefix, because the API lives at the
        # root of the origin (no /api prefix) and everything unlisted has to
        # reach the dashboard instead. Any new backend route must be added here.
        location ~ ^/(health|info|predict|upload-data|retrain|uploaded-data|metrics|insights|sample|figures|docs|redoc|openapi\.json)(/|$) {
            proxy_pass         http://fashion_api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Generous: the first request after a cold start waits on the model
            # load, and a retraining poll can sit behind a TensorFlow epoch.
            proxy_connect_timeout  60s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;

            # Streaming support for long polls.
            proxy_buffering    off;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # Health checks are the load balancer's own heartbeat — keep them out of
        # the access log so they don't drown real traffic during a Locust run.
        location = /health {
            proxy_pass  http://fashion_api/health;
            proxy_set_header Host $host;
            access_log  off;
        }
    }
}
